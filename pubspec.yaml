name: outfitz
description: Weather-smart outfit planner
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.4.0

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  image: ^4.12.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/stickers/
  fonts:
    - family: Prata
      fonts:
        - asset: assets/fonts/Prata-Regular.ttf
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Variable.ttf

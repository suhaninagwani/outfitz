# Kept deliberately modest. The Flutter template ships -Xmx8G, which cannot be
# satisfied on a normal 16 GB laptop once Android Studio and a browser are open —
# the daemon dies with "Native memory allocation (mmap) failed". 2 GB is plenty
# for a project this size.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G

# One worker, no parallel execution. Android builds are not the bottleneck on
# this machine — free memory is.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.configureondemand=true

# Kotlin's incremental caches get locked by Windows Defender mid-build, which
# fails the task with "Could not close incremental caches". Compiling clean costs
# a little time and removes the whole class of flaky failure.
kotlin.incremental=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
